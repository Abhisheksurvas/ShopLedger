<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture and placing an order flow</title>
  <desc id="desc">A layered architecture diagram showing the browser UI, Express server, routers, library modules, configuration, JSON database, and the numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill:#f8fafc; }
      .title { font:700 24px Arial,sans-serif; fill:#0f172a; }
      .subtitle { font:400 13px Arial,sans-serif; fill:#475569; }
      .section { font:700 15px Arial,sans-serif; fill:#334155; }
      .box-title { font:700 14px Arial,sans-serif; fill:#0f172a; }
      .body { font:400 12px Arial,sans-serif; fill:#334155; }
      .small { font:400 12px Arial,sans-serif; fill:#475569; }
      .step { font:700 13px Arial,sans-serif; fill:#0f172a; }
      .flow { font:400 12px Arial,sans-serif; fill:#334155; }
      .panel { stroke:#94a3b8; stroke-width:1.5; rx:10; }
      .node { fill:#ffffff; stroke:#94a3b8; stroke-width:1.3; rx:8; }
      .focus { fill:#fff7ed; stroke:#ea580c; stroke-width:2; rx:8; }
      .route { fill:#eff6ff; stroke:#60a5fa; stroke-width:1.3; rx:8; }
      .data { fill:#ecfdf5; stroke:#34d399; stroke-width:1.5; rx:8; }
      .line { stroke:#475569; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
      .soft-line { stroke:#94a3b8; stroke-width:1.2; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="800"/>
  <text class="title" x="40" y="38">ShopLedger architecture</text>
  <text class="subtitle" x="40" y="61">Node.js CommonJS · Express 4 · static browser UI · JSON persistence</text>

  <!-- Main architecture layers -->
  <text class="section" x="40" y="94">Client</text>
  <rect class="panel" x="40" y="106" width="230" height="236" fill="#f1f5f9"/>
  <text class="box-title" x="58" y="132">Browser UI</text>
  <text class="body" x="58" y="158">public/index.html</text>
  <text class="body" x="58" y="181">public/js/app.js</text>
  <text class="body" x="58" y="204">public/css/style.css</text>
  <text class="small" x="58" y="238">Dashboard, products, orders,</text>
  <text class="small" x="58" y="257">customers, reports, invoices</text>
  <text class="small" x="58" y="286">POST /api/orders</text>
  <text class="small" x="58" y="305">GET /orders/:id/invoice</text>

  <text class="section" x="310" y="94">Application entry point</text>
  <rect class="panel" x="310" y="106" width="230" height="236" fill="#f1f5f9"/>
  <text class="box-title" x="328" y="132">server.js</text>
  <text class="body" x="328" y="158">express.static(public)</text>
  <text class="body" x="328" y="181">bodyParser.json()</text>
  <text class="body" x="328" y="204">app.use('/api', ...)</text>
  <text class="body" x="328" y="227">GET /orders/:id/invoice</text>
  <text class="small" x="328" y="264">Loads routers and lib modules;</text>
  <text class="small" x="328" y="283">starts the HTTP server.</text>
  <text class="small" x="328" y="312">module.exports = app</text>

  <text class="section" x="580" y="94">Express routers</text>
  <rect class="route" x="580" y="106" width="260" height="52"/>
  <text class="box-title" x="596" y="128">routes/orders.js</text>
  <text class="body" x="596" y="147">list · create · cancel orders</text>
  <rect class="route" x="580" y="168" width="260" height="52"/>
  <text class="box-title" x="596" y="190">routes/products.js</text>
  <text class="body" x="596" y="209">products · active coupons</text>
  <rect class="route" x="580" y="230" width="260" height="52"/>
  <text class="box-title" x="596" y="252">routes/customers.js</text>
  <text class="body" x="596" y="271">customers · Khata settlement</text>
  <rect class="route" x="580" y="292" width="260" height="52"/>
  <text class="box-title" x="596" y="314">routes/reports.js</text>
  <text class="body" x="596" y="333">dashboard · GST · export</text>

  <text class="section" x="880" y="94">Library modules</text>
  <rect class="node" x="880" y="106" width="145" height="86"/>
  <text class="box-title" x="892" y="128">lib/orders.js</text>
  <text class="body" x="892" y="150">add · get · cancel</text>
  <text class="body" x="892" y="169">list</text>
  <rect class="node" x="1035" y="106" width="145" height="86"/>
  <text class="box-title" x="1047" y="128">lib/inventory.js</text>
  <text class="body" x="1047" y="150">find · check</text>
  <text class="body" x="1047" y="169">reserve · release</text>

  <rect class="node" x="880" y="202" width="145" height="86"/>
  <text class="box-title" x="892" y="224">lib/pricing.js</text>
  <text class="body" x="892" y="246">subtotal · discount</text>
  <text class="body" x="892" y="265">computeTotals</text>
  <rect class="focus" x="1035" y="202" width="145" height="86"/>
  <text class="box-title" x="1047" y="224">lib/invoice.js</text>
  <text class="body" x="1047" y="246">computeInvoiceFigures</text>
  <text class="body" x="1047" y="265">render</text>

  <rect class="node" x="880" y="298" width="145" height="86"/>
  <text class="box-title" x="892" y="320">lib/coupons.js</text>
  <text class="body" x="892" y="342">normalizeCode · validate</text>
  <text class="body" x="892" y="361">calculateDiscount</text>
  <rect class="focus" x="1035" y="298" width="145" height="86"/>
  <text class="box-title" x="1047" y="320">lib/tax.js</text>
  <text class="body" x="1047" y="342">getRateForItem</text>
  <text class="body" x="1047" y="361">splitCgstSgst</text>

  <rect class="node" x="880" y="394" width="145" height="86"/>
  <text class="box-title" x="892" y="416">lib/ledger.js</text>
  <text class="body" x="892" y="438">findCustomer · charge</text>
  <text class="body" x="892" y="457">reverse · settlement</text>
  <rect class="node" x="1035" y="394" width="145" height="86"/>
  <text class="box-title" x="1047" y="416">lib/reports.js</text>
  <text class="body" x="1047" y="438">dashboard summary</text>
  <text class="body" x="1047" y="457">GST reconciliation</text>

  <rect class="node" x="880" y="490" width="145" height="86"/>
  <text class="box-title" x="892" y="512">lib/store.js</text>
  <text class="body" x="892" y="534">read · write</text>
  <text class="body" x="892" y="553">appendAudit</text>
  <rect class="node" x="1035" y="490" width="145" height="86"/>
  <text class="box-title" x="1047" y="512">lib/dates.js</text>
  <text class="body" x="1047" y="534">today · normalizeDateKey</text>
  <text class="body" x="1047" y="553">getFiscalYear</text>

  <!-- Shared resources -->
  <text class="section" x="40" y="394">Shared resources</text>
  <rect class="data" x="40" y="408" width="230" height="102"/>
  <text class="box-title" x="58" y="436">data/db.json</text>
  <text class="body" x="58" y="460">products · orders · customers</text>
  <text class="body" x="58" y="482">audit log · nextOrderId</text>
  <rect class="data" x="310" y="408" width="230" height="102"/>
  <text class="box-title" x="328" y="436">config.js</text>
  <text class="body" x="328" y="460">shop · tax.hsnSlabs</text>
  <text class="body" x="328" y="482">coupons · port · adminKey</text>

  <!-- Architecture connections -->
  <path class="line" d="M270 220 L310 220"/>
  <path class="line" d="M540 220 L580 220"/>
  <path class="soft-line" d="M840 220 L880 220"/>
  <path class="soft-line" d="M840 250 L880 250"/>
  <path class="soft-line" d="M840 316 L880 316"/>
  <path class="soft-line" d="M840 316 L1035 245"/>
  <path class="soft-line" d="M995 288 L995 394"/>
  <path class="soft-line" d="M1108 288 L1108 298"/>
  <path class="soft-line" d="M1108 384 L1108 394"/>
  <path class="soft-line" d="M995 480 L995 490"/>
  <path class="soft-line" d="M1108 480 L1108 490"/>
  <path class="soft-line" d="M425 342 L425 408"/>
  <path class="soft-line" d="M995 576 L425 576 L425 510"/>
  <path class="soft-line" d="M425 408 L425 510"/>
  <path class="soft-line" d="M540 460 L880 460"/>

  <!-- Numbered placing-an-order flow -->
  <text class="section" x="40" y="616">Numbered flow: placing an order</text>
  <line x1="96" y1="690" x2="1120" y2="690" stroke="#cbd5e1" stroke-width="2"/>

  <circle cx="85" cy="690" r="19" fill="#2563eb"/><text x="85" y="695" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text class="step" x="85" y="650" text-anchor="middle">Choose</text>
  <text class="flow" x="85" y="730" text-anchor="middle">public/ UI</text>

  <circle cx="280" cy="690" r="19" fill="#2563eb"/><text x="280" y="695" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text class="step" x="280" y="650" text-anchor="middle">POST</text>
  <text class="flow" x="280" y="730" text-anchor="middle">/api/orders</text>

  <circle cx="475" cy="690" r="19" fill="#2563eb"/><text x="475" y="695" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text class="step" x="475" y="650" text-anchor="middle">Validate</text>
  <text class="flow" x="475" y="730" text-anchor="middle">inventory + coupon</text>

  <circle cx="670" cy="690" r="19" fill="#ea580c"/><text x="670" y="695" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text class="step" x="670" y="650" text-anchor="middle">Calculate</text>
  <text class="flow" x="670" y="730" text-anchor="middle">pricing + tax</text>

  <circle cx="865" cy="690" r="19" fill="#2563eb"/><text x="865" y="695" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">5</text>
  <text class="step" x="865" y="650" text-anchor="middle">Persist</text>
  <text class="flow" x="865" y="730" text-anchor="middle">orders + audit</text>

  <circle cx="1060" cy="690" r="19" fill="#2563eb"/><text x="1060" y="695" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">6</text>
  <text class="step" x="1060" y="650" text-anchor="middle">Invoice</text>
  <text class="flow" x="1060" y="730" text-anchor="middle">render from order</text>

  <path d="M104 690 L261 690 M299 690 L456 690 M494 690 L651 690 M689 690 L846 690 M884 690 L1041 690" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="40" y="758" width="1120" height="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <rect x="58" y="766" width="18" height="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2" rx="3"/>
  <text class="small" x="84" y="777">Ticket focus: lib/invoice.js and lib/tax.js</text>
  <rect x="330" y="766" width="18" height="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.3" rx="3"/>
  <text class="small" x="356" y="777">HTTP router</text>
  <rect x="480" y="766" width="18" height="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.3" rx="3"/>
  <text class="small" x="506" y="777">Persistent/shared resource</text>
  <text class="small" x="760" y="777">Arrows show primary request/data dependencies</text>
</svg>
